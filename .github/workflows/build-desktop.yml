name: build-desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Release preflight
        run: |
          python scripts/release_preflight.py

      - name: Unit tests
        run: |
          export PYTHONPATH="$PWD/src"
          python -m unittest discover -s tests/unit -v

  windows-x64:
    needs: preflight
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==${env:PYINSTALLER_VERSION}"
          choco install innosetup --yes --no-progress

      - name: Verify Tk
        shell: pwsh
        run: |
          python -c "import tkinter; print('Tk OK')"

      - name: Test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m unittest discover -s tests/unit -v
          python scripts/release_preflight.py

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name AIUsageMonitor `
            --paths src `
            src/main.py

      - name: Smoke packaged Windows executable
        shell: pwsh
        run: |
          $p = Start-Process `
            -FilePath "$PWD\dist\AIUsageMonitor.exe" `
            -ArgumentList '--smoke' `
            -PassThru `
            -Wait
          if ($p.ExitCode -ne 0) {
            throw "Packaged Windows smoke failed with exit code $($p.ExitCode)"
          }
          Write-Host "Packaged Windows smoke: PASS"

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging\windows\AIUsageMonitor.iss

      - name: Install Windows package and smoke
        shell: pwsh
        run: |
          $testDir = Join-Path $env:TEMP ("AIUsageMonitor-CI-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null

          $installer = "$PWD\release\AIUsageMonitor-Setup-Windows-x64.exe"

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/NOICONS',
              "/DIR=`"$testDir`""
            ) `
            -PassThru `
            -Wait

          if ($install.ExitCode -ne 0) {
            throw "Silent installer exited with $($install.ExitCode)"
          }

          $installedExe = Join-Path $testDir 'AIUsageMonitor.exe'

          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Installed executable missing: $installedExe"
          }

          $smoke = Start-Process `
            -FilePath $installedExe `
            -ArgumentList '--smoke' `
            -PassThru `
            -Wait

          if ($smoke.ExitCode -ne 0) {
            throw "Installed Windows executable smoke failed with $($smoke.ExitCode)"
          }

          $uninstaller = Join-Path $testDir 'unins000.exe'

          if (Test-Path -LiteralPath $uninstaller) {
            $uninstall = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @(
                '/VERYSILENT',
                '/SUPPRESSMSGBOXES',
                '/NORESTART'
              ) `
              -PassThru `
              -Wait

            if ($uninstall.ExitCode -ne 0) {
              throw "Silent uninstaller exited with $($uninstall.ExitCode)"
            }
          }

          Write-Host "Windows installer acceptance: PASS"
      - name: Generate Windows SHA256
        shell: pwsh
        run: |
          $installer = "release\AIUsageMonitor-Setup-Windows-x64.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AIUsageMonitor-Setup-Windows-x64.exe" |
            Set-Content -LiteralPath "release\SHA256SUMS-windows-x64.txt" -Encoding ascii
          Get-Content "release\SHA256SUMS-windows-x64.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            release/AIUsageMonitor-Setup-Windows-x64.exe
            release/SHA256SUMS-windows-x64.txt

  macos-arm64:
    needs: preflight
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==$PYINSTALLER_VERSION"

      - name: Verify platform and Tk
        run: |
          uname -m
          python -c "import platform, tkinter; print(platform.machine()); print('Tk OK')"

      - name: Test
        run: |
          export PYTHONPATH="$PWD/src"
          python -m unittest discover -s tests/unit -v
          python scripts/release_preflight.py

      - name: Build macOS ARM64 app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name AIUsageMonitor \
            --paths src \
            src/main.py

      - name: Smoke packaged macOS ARM64 app
        run: |
          test "$(uname -m)" = "arm64"
          file dist/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor
          dist/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor --smoke
          echo "Packaged macOS ARM64 smoke: PASS"

      - name: Build ARM64 DMG
        run: |
          rm -rf release
          mkdir -p release/dmg
          cp -R dist/AIUsageMonitor.app release/dmg/
          cp LICENSE release/dmg/
          hdiutil create \
            -volname "AI Usage Monitor" \
            -srcfolder release/dmg \
            -ov \
            -format UDZO \
            release/AIUsageMonitor-macOS-arm64.dmg

      - name: Mount ARM64 DMG and smoke installed app
        shell: bash
        run: |
          set -euo pipefail

          MOUNT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT" -quiet || true
            rmdir "$MOUNT" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT" \
            release/AIUsageMonitor-macOS-arm64.dmg

          test -x "$MOUNT/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor"

          "$MOUNT/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor" --smoke

          echo "macOS ARM64 DMG acceptance: PASS"
      - name: Generate macOS ARM64 SHA256
        run: |
          cd release
          shasum -a 256 AIUsageMonitor-macOS-arm64.dmg \
            > SHA256SUMS-macOS-arm64.txt
          cat SHA256SUMS-macOS-arm64.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            release/AIUsageMonitor-macOS-arm64.dmg
            release/SHA256SUMS-macOS-arm64.txt

  macos-intel:
    needs: preflight
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==$PYINSTALLER_VERSION"

      - name: Verify platform and Tk
        run: |
          uname -m
          python -c "import platform, tkinter; print(platform.machine()); print('Tk OK')"

      - name: Test
        run: |
          export PYTHONPATH="$PWD/src"
          python -m unittest discover -s tests/unit -v
          python scripts/release_preflight.py

      - name: Build macOS Intel app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name AIUsageMonitor \
            --paths src \
            src/main.py

      - name: Smoke packaged macOS Intel app
        run: |
          test "$(uname -m)" = "x86_64"
          file dist/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor
          dist/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor --smoke
          echo "Packaged macOS Intel smoke: PASS"

      - name: Build Intel DMG
        run: |
          rm -rf release
          mkdir -p release/dmg
          cp -R dist/AIUsageMonitor.app release/dmg/
          cp LICENSE release/dmg/
          hdiutil create \
            -volname "AI Usage Monitor" \
            -srcfolder release/dmg \
            -ov \
            -format UDZO \
            release/AIUsageMonitor-macOS-x64.dmg

      - name: Mount Intel DMG and smoke installed app
        shell: bash
        run: |
          set -euo pipefail

          MOUNT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT" -quiet || true
            rmdir "$MOUNT" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$MOUNT" \
            release/AIUsageMonitor-macOS-x64.dmg

          test -x "$MOUNT/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor"

          "$MOUNT/AIUsageMonitor.app/Contents/MacOS/AIUsageMonitor" --smoke

          echo "macOS Intel DMG acceptance: PASS"
      - name: Generate macOS Intel SHA256
        run: |
          cd release
          shasum -a 256 AIUsageMonitor-macOS-x64.dmg \
            > SHA256SUMS-macOS-x64.txt
          cat SHA256SUMS-macOS-x64.txt

      - uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: |
            release/AIUsageMonitor-macOS-x64.dmg
            release/SHA256SUMS-macOS-x64.txt

  linux-amd64:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==$PYINSTALLER_VERSION"

      - name: Verify platform and Tk
        run: |
          uname -m
          python -c "import platform, tkinter; print(platform.machine()); print('Tk OK')"

      - name: Test
        run: |
          export PYTHONPATH="$PWD/src"
          python -m unittest discover -s tests/unit -v
          python scripts/release_preflight.py

      - name: Build Linux executable
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name ai-usage-monitor \
            --paths src \
            src/main.py

      - name: Smoke packaged Linux executable
        run: |
          test "$(uname -m)" = "x86_64"
          file dist/ai-usage-monitor
          ./dist/ai-usage-monitor --smoke
          echo "Packaged Linux smoke: PASS"

      - name: Build DEB and portable archive
        run: |
          rm -rf package-root release
          mkdir -p \
            package-root/DEBIAN \
            package-root/usr/bin \
            package-root/usr/share/applications \
            package-root/usr/share/doc/ai-usage-monitor \
            release

          cp packaging/linux/control package-root/DEBIAN/control
          cp dist/ai-usage-monitor package-root/usr/bin/ai-usage-monitor
          chmod 0755 package-root/usr/bin/ai-usage-monitor

          cp packaging/linux/ai-usage-monitor.desktop \
            package-root/usr/share/applications/ai-usage-monitor.desktop

          cp packaging/linux/copyright \
            package-root/usr/share/doc/ai-usage-monitor/copyright

          cp LICENSE \
            package-root/usr/share/doc/ai-usage-monitor/LICENSE

          dpkg-deb --build \
            package-root \
            release/ai-usage-monitor_0.3.1_amd64.deb

          tar -C dist -czf \
            release/ai-usage-monitor-linux-amd64.tar.gz \
            ai-usage-monitor

      - name: Extract DEB and smoke installed payload
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package-test-root
          mkdir -p package-test-root

          dpkg-deb -x \
            release/ai-usage-monitor_0.3.1_amd64.deb \
            package-test-root

          test -x package-test-root/usr/bin/ai-usage-monitor

          package-test-root/usr/bin/ai-usage-monitor --smoke

          echo "Linux DEB acceptance: PASS"
      - name: Generate Linux SHA256
        run: |
          cd release
          sha256sum \
            ai-usage-monitor_0.3.1_amd64.deb \
            ai-usage-monitor-linux-amd64.tar.gz \
            > SHA256SUMS-linux-amd64.txt
          cat SHA256SUMS-linux-amd64.txt

      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: |
            release/ai-usage-monitor_0.3.1_amd64.deb
            release/ai-usage-monitor-linux-amd64.tar.gz
            release/SHA256SUMS-linux-amd64.txt

  release-prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs:
      - windows-x64
      - macos-arm64
      - macos-intel
      - linux-amd64
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release-assets/windows-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: release-assets/macos-arm64

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-x64
          path: release-assets/macos-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: release-assets/linux-amd64

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail

          test -f release-assets/windows-x64/AIUsageMonitor-Setup-Windows-x64.exe
          test -f release-assets/windows-x64/SHA256SUMS-windows-x64.txt

          test -f release-assets/macos-arm64/AIUsageMonitor-macOS-arm64.dmg
          test -f release-assets/macos-arm64/SHA256SUMS-macOS-arm64.txt

          test -f release-assets/macos-x64/AIUsageMonitor-macOS-x64.dmg
          test -f release-assets/macos-x64/SHA256SUMS-macOS-x64.txt

          test -f release-assets/linux-amd64/ai-usage-monitor_0.3.1_amd64.deb
          test -f release-assets/linux-amd64/ai-usage-monitor-linux-amd64.tar.gz
          test -f release-assets/linux-amd64/SHA256SUMS-linux-amd64.txt

          echo "Release asset set: PASS"
          find release-assets -type f -maxdepth 2 -print | sort

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # AI Usage Monitor 0.3.1 Release Candidate

          This is the first public cross-platform release candidate of AI Usage Monitor.

          ## Highlights

          - Local-first desktop monitoring for OpenAI Codex.
          - Official Codex quota/reset state when exposed by Codex App Server.
          - Project-folder token accounting with input, cached input, new input, output, reasoning output, and cache-hit rate.
          - Current locally observed model and reasoning effort.
          - Historical model -> reasoning-depth token breakdown with project/model share percentages.
          - Windows, macOS ARM64, macOS Intel, and Linux amd64 builds.
          - Packaged executable smoke tests run on every target platform before release.
          - SHA-256 checksum files included for every platform.

          ## Metric provenance

          - Account quota: `VERIFIED`
          - Project/model token analytics: `LOCAL_OBSERVED`

          Local token analytics are not represented as provider billing totals.

          ## Release status

          This is a **pre-release / release candidate**.

          Windows and macOS artifacts are currently **unsigned**. macOS DMGs are not Apple-notarized yet. Users may therefore see operating-system trust/reputation warnings.

          Please report reproducible issues through GitHub Issues without including credentials, prompts, private rollout content, or proprietary source code.
          EOF

      - name: Create GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t ASSETS < <(
            find release-assets -type f -maxdepth 2 -print | sort
          )

          gh release create "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "AI Usage Monitor $GITHUB_REF_NAME" \
            --notes-file release-notes.md

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isPrerelease,url,assets


